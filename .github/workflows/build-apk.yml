name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RENPY_TAG: "8.5.3.26051504"
      RENPY_SHORT: "8.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download official SDK
        run: |
          set -e
          F="renpy-${RENPY_SHORT}-sdk.tar.bz2"
          U1="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/${F}"
          U2="https://www.renpy.org/dl/${RENPY_SHORT}/${F}"
          wget -q "$U1" -O sdk.tar.bz2 || wget -q "$U2" -O sdk.tar.bz2
          TOP=$(tar tf sdk.tar.bz2 | head -1 | cut -d/ -f1)
          tar xf sdk.tar.bz2 && mv "$TOP" SDK
      - name: Ensure rapt
        run: |
          [ -d SDK/rapt ] || git clone --depth 1 https://github.com/renpy/rapt.git SDK/rapt
      - name: Inject + patches
        run: |
          cp android.json SDK/launcher/android.json
          bash patch.sh SDK/launcher
      - name: rapt installsdk (CWD=rapt, embedded python)
        run: |
          set +e
          cd SDK
          LIB=$(pwd)/lib/py3-linux-x86_64
          chmod +x "$LIB/python"
          export LD_LIBRARY_PATH="$LIB"
          echo "=== rapt/buildlib ==="; ls rapt/buildlib | head -60
          echo "=== pygame_sdl2 in buildlib? ==="; ls -d rapt/buildlib/pygame_sdl2* 2>/dev/null || echo "NOT in buildlib"
          echo "=== ATTEMPT 1: CWD=rapt ==="
          ( cd rapt && yes | "$LIB/python" android.py installsdk ); RC1=$?
          echo "RC1=$RC1"
          if [ $RC1 -ne 0 ]; then
            echo "=== ATTEMPT 2: CWD=SDK + PYTHONPATH=rapt/buildlib ==="
            PYTHONPATH="$(pwd)/rapt/buildlib" yes | "$LIB/python" rapt/android.py installsdk; RC2=$?
            echo "RC2=$RC2"
            [ $RC2 -ne 0 ] && exit 1
          fi
      - name: Build launcher DEBUG apk
        run: |
          cd SDK
          LIB=$(pwd)/lib/py3-linux-x86_64
          export LD_LIBRARY_PATH="$LIB"
          ( cd rapt && "$LIB/python" android.py build launcher debug )
      - name: Collect apk
        run: |
          cd SDK && mkdir -p out
          find . -name '*.apk' -print -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: SDK/out/*.apk
