name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RENPY_TAG: "8.5.3.26051504"
      RENPY_SHORT: "8.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download official SDK
        run: |
          set -e
          F="renpy-${RENPY_SHORT}-sdk.tar.bz2"
          U1="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/${F}"
          U2="https://www.renpy.org/dl/${RENPY_SHORT}/${F}"
          wget -q "$U1" -O sdk.tar.bz2 || wget -q "$U2" -O sdk.tar.bz2
          TOP=$(tar tf sdk.tar.bz2 | head -1 | cut -d/ -f1)
          tar xf sdk.tar.bz2 && mv "$TOP" SDK
      - name: Ensure rapt
        run: |
          [ -d SDK/rapt ] || git clone --depth 1 https://github.com/renpy/rapt.git SDK/rapt
      - name: Inject android.json + patches
        run: |
          cp android.json SDK/launcher/android.json
          bash patch.sh SDK/launcher
      - name: Locate rapt entry + installsdk
        run: |
          cd SDK
          echo "=== SDK root ==="; ls
          echo "=== SDK/rapt ==="; ls rapt
          ENTRY=$(ls rapt/android.py rapt/build.py rapt/rapt.py rapt/main.py 2>/dev/null | head -1)
          if [ -z "$ENTRY" ]; then
            echo "NO ENTRY FOUND, all py in rapt root:"; find rapt -maxdepth 1 -name '*.py'; exit 1
          fi
          echo "ENTRY = $ENTRY"
          yes | python3 "$ENTRY" installsdk || python3 "$ENTRY" installsdk
      - name: Build launcher DEBUG apk
        run: |
          cd SDK
          ENTRY=$(ls rapt/android.py rapt/build.py rapt/rapt.py rapt/main.py 2>/dev/null | head -1)
          echo "ENTRY = $ENTRY"
          python3 "$ENTRY" build launcher debug
      - name: Collect apk
        run: |
          cd SDK && mkdir -p out
          find . -name '*.apk' -print -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: SDK/out/*.apk
