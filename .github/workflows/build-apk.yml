name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RENPY_TAG: "8.5.3.26051504"
      RENPY_SHORT: "8.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download official SDK
        run: |
          set -e
          F="renpy-${RENPY_SHORT}-sdk.tar.bz2"
          U1="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/${F}"
          U2="https://www.renpy.org/dl/${RENPY_SHORT}/${F}"
          wget -q "$U1" -O sdk.tar.bz2 || wget -q "$U2" -O sdk.tar.bz2
          TOP=$(tar tf sdk.tar.bz2 | head -1 | cut -d/ -f1)
          tar xf sdk.tar.bz2 && mv "$TOP" SDK
      - name: Ensure rapt
        run: |
          [ -d SDK/rapt ] || git clone --depth 1 https://github.com/renpy/rapt.git SDK/rapt
      - name: Inject + patches
        run: |
          cp android.json SDK/launcher/android.json
          bash patch.sh SDK/launcher
      - name: Facts about embedded python
        run: |
          cd SDK
          echo "=== ls lib/py3-linux-x86_64 ==="; ls -la lib/py3-linux-x86_64 | head -60
          echo "=== pygame_sdl2 in linux dir ==="; find lib/py3-linux-x86_64 -name 'pygame_sdl2*' | head
          echo "=== head android.py ==="; sed -n '1,20p' rapt/android.py
          echo "=== renpy.sh ==="; cat renpy.sh
          true
      - name: rapt installsdk (embedded python)
        run: |
          cd SDK
          chmod +x lib/py3-linux-x86_64/python 2>/dev/null || true
          export LD_LIBRARY_PATH="$PWD/lib/py3-linux-x86_64"
          export PYTHONPATH="$PWD:$PWD/lib/py3-linux-x86_64:$PWD/lib/python3.12"
          PY=lib/py3-linux-x86_64/python
          yes | $PY rapt/android.py installsdk || $PY rapt/android.py installsdk
      - name: Build launcher DEBUG apk
        run: |
          cd SDK
          export LD_LIBRARY_PATH="$PWD/lib/py3-linux-x86_64"
          export PYTHONPATH="$PWD:$PWD/lib/py3-linux-x86_64:$PWD/lib/python3.12"
          lib/py3-linux-x86_64/python rapt/android.py build launcher debug
      - name: Collect apk
        run: |
          cd SDK && mkdir -p out
          find . -name '*.apk' -print -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: SDK/out/*.apk
