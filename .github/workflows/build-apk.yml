name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RENPY_TAG: "8.5.3.26051504"
      RENPY_SHORT: "8.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build deps for pygame_sdl2
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libfreetype-dev libjpeg-dev libpng-dev cython3 virtualenv
      - name: Download official SDK
        run: |
          set -e
          F="renpy-${RENPY_SHORT}-sdk.tar.bz2"
          U1="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/${F}"
          U2="https://www.renpy.org/dl/${RENPY_SHORT}/${F}"
          wget -q "$U1" -O sdk.tar.bz2 || wget -q "$U2" -O sdk.tar.bz2
          TOP=$(tar tf sdk.tar.bz2 | head -1 | cut -d/ -f1)
          tar xf sdk.tar.bz2 && mv "$TOP" SDK
      - name: Ensure rapt
        run: |
          [ -d SDK/rapt ] || git clone --depth 1 https://github.com/renpy/rapt.git SDK/rapt
      - name: Build host platform files (pygame_sdl2)
        run: |
          cd SDK
          echo "=== after_checkout.sh exists? ==="; ls -la after_checkout.sh 2>/dev/null || echo "NO after_checkout.sh"
          if [ -x after_checkout.sh ] || [ -f after_checkout.sh ]; then
            bash after_checkout.sh . 2>&1 | tail -40 || echo "after_checkout failed (see above)"
          fi
          echo "=== pygame_sdl2 now? ==="; find . -name 'pygame_sdl2*' | grep -v '\.sh' | head
      - name: Inject + patches
        run: |
          cp android.json SDK/launcher/android.json
          bash patch.sh SDK/launcher
      - name: rapt installsdk
        run: |
          cd SDK
          LIB=$(pwd)/lib/py3-linux-x86_64
          chmod +x "$LIB/python" 2>/dev/null || true
          export LD_LIBRARY_PATH="$LIB"
          ( cd rapt && yes | "$LIB/python" android.py installsdk ) || \
          ( PYTHONPATH="$(pwd)/lib/py3-linux-x86_64:$(pwd)/lib/python3.12" yes | "$LIB/python" rapt/android.py installsdk )
      - name: Build launcher DEBUG apk
        run: |
          cd SDK
          LIB=$(pwd)/lib/py3-linux-x86_64
          export LD_LIBRARY_PATH="$LIB"
          ( cd rapt && "$LIB/python" android.py build launcher debug )
      - name: Collect apk
        run: |
          cd SDK && mkdir -p out
          find . -name '*.apk' -print -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: SDK/out/*.apk
