name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RENPY_TAG: "8.5.3.26051504"
      RENPY_SHORT: "8.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download official SDK
        run: |
          set -e
          F="renpy-${RENPY_SHORT}-sdk.tar.bz2"
          U1="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/${F}"
          U2="https://www.renpy.org/dl/${RENPY_SHORT}/${F}"
          wget -q "$U1" -O sdk.tar.bz2 || wget -q "$U2" -O sdk.tar.bz2
          TOP=$(tar tf sdk.tar.bz2 | head -1 | cut -d/ -f1)
          tar xf sdk.tar.bz2 && mv "$TOP" SDK
      - name: Ensure rapt
        run: |
          [ -d SDK/rapt ] || git clone --depth 1 https://github.com/renpy/rapt.git SDK/rapt
      - name: Inject + patches (guard desktop-only imports)
        run: |
          cp android.json SDK/launcher/android.json
          bash patch.sh SDK/launcher
          # guard pygame_sdl2 import in rapt so installsdk can run without it
          python - SDK/rapt/android.py <<'PY'
          import sys,re
          p=sys.argv[1]; c=open(p).read()
          c=re.sub(r'(?m)^(\s*)import pygame_sdl2\s*$',
                   r'\1try: import pygame_sdl2\n\1except Exception: pass', c)
          open(p,'w').write(c); print("guarded pygame_sdl2 in rapt/android.py")
          PY
      - name: Inspect SDK layout (facts)
        run: |
          cd SDK
          echo "=== python ver ==="; python3 --version
          echo "=== ls lib ==="; ls -la lib 2>/dev/null
          echo "=== find pygame_sdl2 (any) ==="; find . -name 'pygame_sdl2*' | head -40
          echo "=== find python bins in lib ==="; find lib -name 'python*' -type f | head -40
          echo "=== lib tree 3 levels ==="; find lib -maxdepth 3 | head -120
          true
      - name: rapt installsdk
        run: |
          cd SDK
          yes | python3 rapt/android.py installsdk || python3 rapt/android.py installsdk
      - name: Build launcher DEBUG apk
        run: |
          cd SDK
          python3 rapt/android.py build launcher debug
      - name: Collect apk
        run: |
          cd SDK && mkdir -p out
          find . -name '*.apk' -print -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: SDK/out/*.apk
