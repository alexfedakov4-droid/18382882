name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RENPY_TAG: "8.5.3.26051504"
      RENPY_SHORT: "8.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download official SDK
        run: |
          set -e
          F="renpy-${RENPY_SHORT}-sdk.tar.bz2"
          U1="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/${F}"
          U2="https://www.renpy.org/dl/${RENPY_SHORT}/${F}"
          wget -q "$U1" -O sdk.tar.bz2 || wget -q "$U2" -O sdk.tar.bz2
          TOP=$(tar tf sdk.tar.bz2 | head -1 | cut -d/ -f1)
          tar xf sdk.tar.bz2 && mv "$TOP" SDK
      - name: Ensure rapt
        run: |
          [ -d SDK/rapt ] || git clone --depth 1 https://github.com/renpy/rapt.git SDK/rapt
      - name: Inject android.json + patches
        run: |
          cp android.json SDK/launcher/android.json
          bash patch.sh SDK/launcher
      - name: Probe pygame_sdl2 + set PYTHONPATH
        run: |
          cd SDK
          echo "=== python ==="; python3 --version
          echo "=== lib (2 levels) ==="; find lib -maxdepth 2 2>/dev/null | head -60
          echo "=== find pygame_sdl2 ==="; find . -maxdepth 5 -name 'pygame_sdl2*' | head
          PGD=$(find . -maxdepth 5 \( -name 'pygame_sdl2' -type d -o -name 'pygame_sdl2*.so' \) | head -1)
          PGDIR=$(dirname "$PGD")
          echo "PGDIR=$PGDIR"
          FULL="$PGDIR:$PWD/lib:$PWD:$PWD/rapt"
          echo "PYTHONPATH=$FULL" >> $GITHUB_ENV
          export PYTHONPATH="$FULL"
          python3 -c "import pygame_sdl2; print('OK', pygame_sdl2.__file__)" || echo "IMPORT FAILED (see facts above)"
      - name: rapt installsdk
        run: |
          cd SDK
          echo "PYTHONPATH=$PYTHONPATH"
          yes | python3 rapt/android.py installsdk || python3 rapt/android.py installsdk
      - name: Build launcher DEBUG apk
        run: |
          cd SDK
          python3 rapt/android.py build launcher debug
      - name: Collect apk
        run: |
          cd SDK && mkdir -p out
          find . -name '*.apk' -print -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: SDK/out/*.apk
