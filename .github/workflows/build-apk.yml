name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RENPY_TAG: "8.5.3.26051504"
      RENPY_SHORT: "8.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Download official SDK
        run: |
          set -e
          F="renpy-${RENPY_SHORT}-sdk.tar.bz2"
          U1="https://github.com/renpy/renpy/releases/download/${RENPY_TAG}/${F}"
          U2="https://www.renpy.org/dl/${RENPY_SHORT}/${F}"
          wget -q "$U1" -O sdk.tar.bz2 || wget -q "$U2" -O sdk.tar.bz2
          TOP=$(tar tf sdk.tar.bz2 | head -1 | cut -d/ -f1)
          tar xf sdk.tar.bz2 && mv "$TOP" SDK
      - name: Ensure rapt
        run: |
          [ -d SDK/rapt ] || git clone --depth 1 https://github.com/renpy/rapt.git SDK/rapt
      - name: Inject + patches + guard pygame_sdl2 in rapt
        run: |
          cp android.json SDK/launcher/android.json
          bash patch.sh SDK/launcher
          python - SDK/rapt/android.py <<'PY'
          import sys,re
          p=sys.argv[1]; c=open(p).read()
          c=re.sub(r'(?m)^(\s*)import pygame_sdl2\s*$',
                   r'\1try: import pygame_sdl2\n\1except Exception: pass', c)
          open(p,'w').write(c); print("guarded pygame_sdl2")
          PY
      - name: Verify rapt imports (fast, no download)
        run: |
          cd SDK
          LIB=$(pwd)/lib/py3-linux-x86_64
          chmod +x "$LIB/python" 2>/dev/null || true
          export LD_LIBRARY_PATH="$LIB"
          export PYTHONPATH="$(pwd)/rapt/buildlib"
          ( cd rapt && "$LIB/python" -c "import rapt.interface, rapt.install_sdk; print('RAPT IMPORTS OK')" )
      - name: rapt installsdk
        run: |
          cd SDK
          LIB=$(pwd)/lib/py3-linux-x86_64
          export LD_LIBRARY_PATH="$LIB"
          export PYTHONPATH="$(pwd)/rapt/buildlib"
          ( cd rapt && yes | "$LIB/python" android.py installsdk )
      - name: Build launcher DEBUG apk
        run: |
          cd SDK
          LIB=$(pwd)/lib/py3-linux-x86_64
          export LD_LIBRARY_PATH="$LIB"
          export PYTHONPATH="$(pwd)/rapt/buildlib"
          ( cd rapt && "$LIB/python" android.py build launcher debug )
      - name: Collect apk
        run: |
          cd SDK && mkdir -p out
          find . -name '*.apk' -print -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: SDK/out/*.apk
